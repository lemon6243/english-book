<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 연습장">
<meta name="theme-color" content="#2F5BEA">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>동화책 영어 연습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one narrow column, big tap targets. Home (books) -> Book (modes + sentences) -> Activity (one sentence per screen). */
:root {
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --ink: #17214A;
  --muted: #5B6486;
  --line: #D9E0F0;
  --soft: #E8EEFC;
  --brand: #3558E6;
  --brand-ink: #FFFFFF;
  --star: #F5A800;
  --ok: #1B8C58;
  --ok-bg: #E3F5EC;
  --warn: #C9471F;
  --warn-bg: #FDEBE4;
  --font-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-en: "Andika", "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1430; --surface: #172046; --ink: #EEF1FF; --muted: #A4ADD6; --line: #2B3768;
    --soft: #1F2B5C; --brand: #7F9BFF; --brand-ink: #0E1430; --star: #FFC94D;
    --ok: #52D69A; --ok-bg: #123A2C; --warn: #FF8A63; --warn-bg: #43211A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1430; --surface: #172046; --ink: #EEF1FF; --muted: #A4ADD6; --line: #2B3768;
  --soft: #1F2B5C; --brand: #7F9BFF; --brand-ink: #0E1430; --star: #FFC94D;
  --ok: #52D69A; --ok-bg: #123A2C; --warn: #FF8A63; --warn-bg: #43211A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 28px; }
h2 { font-size: 24px; }
h3 { font-size: 19px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.muted { color: var(--muted); font-size: 15px; }
.en { font-family: var(--font-en); }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.kids { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  min-height: 44px; padding: 6px 18px; border-radius: 999px; border: 2px solid var(--line);
  background: var(--surface); font-family: var(--font-display); font-size: 18px;
}
.chip[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.stars { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 20px; padding: 0 6px; }
.stars svg, .ico-star { width: 22px; height: 22px; fill: var(--star); flex: none; }
.gear { min-height: 44px; min-width: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.book-title { background: none; border: 0; padding: 0; text-align: left; font-family: var(--font-en); font-weight: 700; font-size: 20px; color: var(--ink); }
.tag { display: inline-block; font-size: 13px; padding: 1px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-left: 8px; font-family: var(--font-body); font-weight: 400; vertical-align: middle; }
.bar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--muted); }

.btn {
  min-height: 52px; padding: 10px 22px; border-radius: 14px; border: 2px solid var(--brand);
  background: var(--brand); color: var(--brand-ink); font-family: var(--font-display); font-size: 19px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn.ghost { background: var(--surface); color: var(--brand); }
.btn.plain { background: transparent; border-color: var(--line); color: var(--muted); }
.btn.plain[aria-pressed="true"] { background: var(--soft); border-color: var(--brand); color: var(--brand); }
.btn.danger { background: var(--surface); border-color: var(--warn); color: var(--warn); }
.btn.big { min-height: 64px; font-size: 22px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 22px; height: 22px; fill: currentColor; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > * { flex: 1 1 140px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode { text-align: left; padding: 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; min-height: 96px; }
.mode b { font-family: var(--font-display); font-weight: 400; font-size: 21px; color: var(--brand); }
.mode span { font-size: 14px; color: var(--muted); line-height: 1.4; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.toggle input { width: 24px; height: 24px; accent-color: var(--brand); }

.slist { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.slist li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-family: var(--font-en); font-size: 18px; }
.slist li:first-child { border-top: 0; }
.slist small { font-family: var(--font-body); color: var(--muted); font-size: 14px; }
.slist .done { color: var(--ok); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { min-height: 44px; padding: 4px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
.pill { font-family: var(--font-display); font-size: 18px; color: var(--muted); }

.stage { padding: 22px 18px; gap: 18px; }
.sentence { font-family: var(--font-en); font-size: clamp(26px, 6.4vw, 40px); line-height: 1.45; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.w { background: none; border: 0; padding: 2px 4px; border-radius: 8px; font: inherit; color: inherit; cursor: pointer; }
.w:hover { background: var(--soft); }
.w.now { background: var(--star); color: #17214A; }
.sentence.plain .w { cursor: default; }
.hidden-sentence { font-family: var(--font-en); font-size: 28px; letter-spacing: 6px; color: var(--muted); }
.field {
  width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); font-family: var(--font-en); font-size: 24px; line-height: 1.4; resize: none;
}
.field.small { font-family: var(--font-body); font-size: 17px; min-height: 52px; }
textarea.field.tall { min-height: 200px; font-family: var(--font-body); font-size: 17px; }
label.lab { font-family: var(--font-display); font-size: 17px; display: block; margin-bottom: 6px; }

.fb { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.try { background: var(--warn-bg); color: var(--warn); }
.fb b { font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.attempt { font-family: var(--font-en); font-size: 22px; display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--ink); }
.attempt .bad { text-decoration: underline wavy var(--warn); text-underline-offset: 6px; color: var(--warn); }
.answer { font-family: var(--font-en); font-size: 22px; font-weight: 700; color: var(--ink); background: var(--surface); border-radius: 10px; padding: 8px 12px; }

.slots, .pool { display: flex; flex-wrap: wrap; gap: 10px; min-height: 64px; padding: 10px; border-radius: 14px; }
.slots { background: var(--bg); border: 2px dashed var(--line); }
.tile { min-height: 52px; padding: 6px 16px; border-radius: 12px; border: 2px solid var(--brand); background: var(--surface); color: var(--ink); font-family: var(--font-en); font-size: 22px; font-weight: 700; }
.slots .tile { background: var(--soft); }
.tile[disabled] { opacity: .25; }

.done-card { align-items: center; text-align: center; gap: 14px; padding: 28px 18px; }
.done-card .big-stars { display: flex; gap: 6px; }
.done-card .big-stars svg { width: 44px; height: 44px; fill: var(--star); }
.pop { animation: pop .5s ease-out both; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

.photo { background: var(--soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.photo .msg { font-size: 15px; color: var(--muted); min-height: 1.5em; }
.photo .msg.warn { color: var(--warn); }
label.btn { cursor: pointer; }
.ko { display: block; font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--muted); }
.kobox { background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 19px; }
.wordcard { align-items: center; text-align: center; padding: 28px 18px; gap: 16px; }
.bigword { font-family: var(--font-en); font-weight: 700; font-size: clamp(40px, 12vw, 64px); line-height: 1.2; overflow-wrap: anywhere; }
.meaning { font-family: var(--font-display); font-size: 28px; min-height: 44px; color: var(--brand); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.choice { min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-display); font-size: 21px; padding: 8px; }
.choice.bad { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.choice.good { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.choice[disabled] { cursor: default; }
details.opt { border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px 14px; }
details.opt summary { cursor: pointer; font-family: var(--font-display); font-size: 17px; min-height: 40px; display: flex; align-items: center; }
.wlist { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { padding: 4px 12px; border-radius: 999px; background: var(--soft); font-family: var(--font-en); font-size: 16px; }
.wchip small { font-family: var(--font-body); color: var(--muted); margin-left: 8px; font-size: 14px; }
.wchip.known { background: var(--ok-bg); color: var(--ok); }
.mode[disabled] { opacity: .5; cursor: default; }
.warnc { color: var(--warn); }
.xl-en { background: none; border: 0; padding: 0; text-align: left; font-family: var(--font-en); font-weight: 700; font-size: 22px; line-height: 1.5; color: var(--ink); cursor: pointer; overflow-wrap: anywhere; }
.xl-en:hover { color: var(--brand); }
.liblist { display: flex; flex-direction: column; gap: 10px; }
.lib { min-height: 64px; width: 100%; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lib.on { border-color: var(--brand); background: var(--soft); }
.libt { display: flex; flex-direction: column; min-width: 0; }
.libt b { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.libs { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.libs small { color: var(--muted); font-size: 13px; }
.libs .tag { margin-left: 0; }
.pet { display: block; width: 100%; max-width: 200px; margin: 0 auto; background: none; border: 0; padding: 0; }
button.pet { cursor: pointer; }
.pet svg { width: 100%; height: auto; display: block; overflow: visible; animation: bob 3.2s ease-in-out infinite; }
.pet.mini { max-width: 96px; }
.pet.sm { max-width: 130px; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.mouth-open { opacity: 0; transform-box: fill-box; transform-origin: center; }
.talk .mouth-open { opacity: 1; animation: talk .25s ease-in-out infinite alternate; }
.talk .smile { opacity: 0; }
@keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.egg { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 2.4s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.twinkle { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { transform: scale(.6); opacity: .6; } 50% { transform: scale(1.1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pet svg, .eyes, .egg, .twinkle, .talk .mouth-open { animation: none !important; } .pausebar i { animation-duration: .01s !important; } }
.petrow { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 14px; align-items: center; }
@media (max-width: 420px) { .petrow { grid-template-columns: 1fr; } }
.bubble { background: var(--soft); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.bubble .en { font-family: var(--font-en); font-weight: 700; font-size: 19px; }
.bubble .kor { color: var(--muted); font-size: 15px; }
.pinfo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 20px; }
.goal { gap: 10px; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; }
.dot { width: 34px; text-align: center; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dot i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: block; }
.dot.on i { background: var(--star); border-color: var(--star); }
.levelup { flex-direction: row; align-items: center; gap: 14px; background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.levelup p { color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.acc { min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-display); font-size: 17px; padding: 6px; }
.acc small { font-family: var(--font-body); color: var(--muted); font-size: 12px; }
.acc[aria-pressed="true"] { border-color: var(--brand); background: var(--soft); color: var(--brand); }
.acc[disabled] { opacity: .5; cursor: default; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; }
.swatch[aria-checked="true"] { border-color: var(--ink); }
.species { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; }
.sp { border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 8px 4px; font-family: var(--font-display); font-size: 17px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sp[aria-checked="true"] { border-color: var(--brand); background: var(--soft); }
.sp .pet { max-width: 90px; }
.pausebar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.pausebar i { display: block; height: 100%; background: var(--brand); width: 0; animation: fill linear forwards; }
@keyframes fill { to { width: 100%; } }
.status { font-family: var(--font-display); font-size: 20px; color: var(--brand); text-align: center; }
.cheer { font-size: 18px; }
.blanks { font-family: var(--font-en); font-size: 30px; letter-spacing: 6px; color: var(--muted); overflow-wrap: anywhere; }
.ctrl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.note { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; color: var(--muted); }
.empty { text-align: center; padding: 20px 6px; color: var(--muted); }
@media (max-width: 420px) { .modes { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  var KEY = 'storybook-english-v1';
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>';
  var SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  var PHOTO_CARD = '<div class="photo" id="ph-card" hidden><div><b class="lab" style="margin:0">사진으로 문장 가져오기</b>' +
    '<p class="muted">책 페이지를 사진으로 올리면 영어 문장을 읽어 아래 입력창에 넣습니다. 여러 장을 한 번에 고를 수 있습니다.</p></div>' +
    '<label class="toggle"><input type="checkbox" id="ph-gen" checked> 읽은 뒤 한국어 뜻과 핵심 단어도 함께 만들기</label>' +
    '<div class="row" id="ph-btn"><label class="btn ghost" for="ph-cam">사진 찍기</label><label class="btn ghost" for="ph-file">갤러리에서 선택</label></div><input type="file" id="ph-cam" accept="image/*" capture="environment" hidden><input type="file" id="ph-file" multiple hidden>' +
    '<p class="msg" id="ph-msg" role="status"></p><button class="btn plain" data-a="photo-stop" id="ph-stop" hidden>중단</button></div>';

  function sampleBook() {
    return { id: 'sample', title: 'Mia and the Red Hat', sample: true, sentences: [
      'Mia has a red hat.', 'The hat is big.', 'A little dog sees the hat.', 'The dog jumps and runs.',
      'Mia laughs and runs after him.', 'The dog gives the hat to Mia.', 'Mia says thank you.', 'Now they are happy friends.'
    ], trans: {
      'Mia has a red hat.': '미아는 빨간 모자가 있어요.', 'The hat is big.': '모자는 커요.',
      'A little dog sees the hat.': '작은 강아지가 모자를 봐요.', 'The dog jumps and runs.': '강아지가 뛰어올라 달려가요.',
      'Mia laughs and runs after him.': '미아는 웃으며 강아지를 쫓아가요.', 'The dog gives the hat to Mia.': '강아지가 모자를 미아에게 줘요.',
      'Mia says thank you.': '미아는 고맙다고 말해요.', 'Now they are happy friends.': '이제 둘은 행복한 친구예요.'
    }, words: [
      { en: 'hat', ko: '모자' }, { en: 'red', ko: '빨간' }, { en: 'big', ko: '큰' }, { en: 'little', ko: '작은' },
      { en: 'dog', ko: '강아지' }, { en: 'jump', ko: '뛰어오르다' }, { en: 'run', ko: '달리다' }, { en: 'laugh', ko: '웃다' },
      { en: 'give', ko: '주다' }, { en: 'friend', ko: '친구' }, { en: 'happy', ko: '행복한' }
    ] };
  }
  function defaults() {
    return { kids: [{ id: 'k1', name: '첫째' }, { id: 'k2', name: '둘째' }], active: 'k1', books: [sampleBook()],
      progress: {}, stars: {}, vocab: {}, current: {}, pets: {}, days: {}, daily: {}, follow: true, cheer: true, goal: 10, rate: 0.9, shuffle: false };
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.kids && s.books) {
      migrate(s);
      s.books.forEach(function (b) {
        if (b.id === 'sample' && !b.words) { var sb = sampleBook(); if (b.sentences.join('|') === sb.sentences.join('|')) { b.trans = sb.trans; b.words = sb.words; } }
      });
      return s;
    } } catch (e) {}
    return defaults();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var state = load();
  var view = { name: 'home' };
  var act = null;
  var app = document.getElementById('app');

  function seedBuiltin(force) {
    state.seeded = state.seeded || {};
    var changed = false;
    BUILTIN.forEach(function (bk) {
      var has = state.books.some(function (b) { return b.id === bk.id; });
      if (has) { state.seeded[bk.id] = true; return; }
      if (!state.seeded[bk.id] || force) { state.books.push(JSON.parse(JSON.stringify(bk))); state.seeded[bk.id] = true; changed = true; }
    });
    if (changed) save();
  }

  }

  /* ---------- activity ---------- */
  var MODE_NAME = { story: '읽어주기', read: '읽기', copy: '보고 쓰기', dict: '듣고 쓰기', build: '단어 조립', card: '단어 카드', quiz: '단어 퀴즈', spell: '단어 쓰기' };

  function startActivity(mode) {

  function prepareWord() {

      while (words.length > 1 && mix.join(' ') === words.join(' ') && guard++ < 10) mix = shuffled(words);

  function actView() {

        '<textarea class="field" id="ans" rows="2" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="여기에 써요"' + (locked ? ' readonly' : '') + '>' + esc(act.input) + '</textarea>' + fb +

      var pool = act.tiles.map(function (t) { return '<button class="tile" data-a="place" data-k="' + t.k + '"' + (t.used ? ' disabled' : '') + '>' + esc(t.w) + '</button>'; }).join('');

        (ok ? '<div class="fb ok pop"><b>맞았어요! 별 1개를 받았어요.</b><span class="en cheer">' + esc(cheerText) + '</span></div><button class="btn big" data-a="next">다음 문장</button>'

  function vocabView(b) {

        '<input class="field" id="ans" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="영어로 써요" value="' + esc(act.input) + '"' + (ok ? ' readonly' : '') + '>' + sfb +
        (ok ? '<button class="btn big" data-a="next">다음 단어</button>' : '<button class="btn big" data-a="check">확인</button>') + '</div>';

    if (typed === target) { act.fb = { ok: true }; act.earned++; bump(act.bid, act.i, 'w'); return; }
    act.tries++;

    return { trans: tr.map(function (x) { return String(x).replace(/\s+/g, ' ').trim(); }), words: words };
  }
  async function runGen(sents, btnId, apply) {
    var ctl = new AbortController(); photoCtl = ctl;
    var dt = document.querySelector('details.opt'); if (dt) dt.open = true;
    var btn = document.getElementById(btnId); if (btn) btn.disabled = true;
    genMsg('한국어 뜻과 핵심 단어를 만드는 중입니다. 잠시만 기다려 주세요.');
    try { var g = await generate(sents, ctl.signal); apply(g); }
    catch (e) { genMsg(e && e.code === 'cancelled' ? '중단했습니다.' : phError(e && e.code), true); }
    finally { if (photoCtl === ctl) photoCtl = null; var b2 = document.getElementById(btnId); if (b2) b2.disabled = false; }
  }
  function applyForm(sents, g) {
    var ta = document.getElementById('bk-text'); if (!ta) return;
    ta.value = sents.join('\n');
    document.getElementById('bk-trans').value = g.trans.join('\n');
    document.getElementById('bk-words').value = g.words.map(function (w) { return w.en + ' - ' + w.ko; }).join('\n');
    view.draft = readDraft();
    genMsg('한국어 뜻 ' + g.trans.length + '개와 핵심 단어 ' + g.words.length + '개를 만들었습니다. 내용을 확인하고 틀린 부분은 고친 뒤 저장해 주세요.');
  }
  function applyBook(b, g) {
    b.trans = b.trans || {};
    b.sentences.forEach(function (x, i) { if (g.trans[i]) b.trans[x] = g.trans[i]; });
    b.words = g.words; save();
    view.msg = '한국어 뜻 ' + g.trans.length + '개와 핵심 단어 ' + g.words.length + '개를 만들었습니다. 자동 번역은 참고용이며, 고치려면 아래 "문장 수정"을 눌러 주세요.';
    render('keep');
  }
  function phMsg(t, warn) { var m = document.getElementById('ph-msg'); if (m) { m.textContent = t; m.className = 'msg' + (warn ? ' warn' : ''); } }
  function phBusy(b) {
    var st = document.getElementById('ph-stop'); if (st) st.hidden = !b;
    var bt = document.getElementById('ph-btn'); if (bt) { bt.style.opacity = b ? '.45' : ''; bt.style.pointerEvents = b ? 'none' : ''; }
  }
  function phAppend(text) {
    var ta = document.getElementById('bk-text'), ti = document.getElementById('bk-title'); if (!ta || !ti) return;
    ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' : '') + text;
    view.draft = readDraft();
    var c = document.getElementById('bk-count'); if (c) c.textContent = '인식된 문장: ' + parseSentences(ta.value).length + '개';
  }
  function phError(code) {
    if (code === 'bad_key') return 'API 키를 확인해 주세요. 키가 맞지 않거나 사용 한도를 넘었을 수 있습니다.';
    if (code === 'network') return '인터넷 연결을 확인해 주세요.';
    if (code === 'not_granted' || code === 'sampling_disabled') return '사진 인식이 허용되지 않았습니다. 문장을 직접 입력해 주세요.';
    if (code === 'image_rejected') return '이 사진은 읽을 수 없습니다. 다른 사진으로 시도해 주세요.';
    if (code === 'rate_limited') return '요청이 많습니다. 잠시 후 다시 시도해 주세요.';
    if (code === 'refused') return '이 사진은 읽을 수 없습니다. 다른 사진으로 시도해 주세요.';
    if (code === 'mismatch' || code === 'invalid_json') return '결과를 정리하지 못했습니다. 잠시 후 다시 시도해 주세요.';
    return '사진을 읽지 못했습니다. 다시 시도하거나 문장을 직접 입력해 주세요.';
  }
  async function readPhotos(files) {
    var list = files.slice(0, 10), added = 0, empty = 0, stopped = false, ctl = new AbortController();
    photoCtl = ctl; phBusy(true);
    try {
      for (var n = 0; n < list.length; n++) {
        phMsg((n + 1) + ' / ' + list.length + '장을 읽는 중입니다. 잠시만 기다려 주세요.');
        var res = await photo.sample(PHOTO_PROMPT, { images: list[n], signal: ctl.signal });
        var raw = res.text.replace(/```[a-z]*/gi, '').trim();
        var sents = /^NO_TEXT$/i.test(raw) ? [] : parseSentences(raw);
        if (!sents.length) { empty++; continue; }
        phAppend(sents.join('\n')); added++;
      }
      if (added) phMsg(added + '장을 읽어 입력창에 넣었습니다. 책과 한 줄씩 비교해 틀린 부분을 꼭 고쳐 주세요.' + (empty ? ' 영어 문장을 찾지 못한 사진이 ' + empty + '장 있습니다.' : ''));
      else phMsg('영어 문장을 찾지 못했습니다. 글자가 선명하게 보이도록 다시 찍어 주세요.', true);
    } catch (e) {
      stopped = true;
      if (e && e.code === 'cancelled') phMsg('중단했습니다. 이미 읽은 문장은 입력창에 남아 있습니다.');
      else phMsg(phError(e && e.code), true);
    } finally { phBusy(false); if (photoCtl === ctl) photoCtl = null; }
    var cb = document.getElementById('ph-gen');
    if (added && !stopped && ai && cb && cb.checked) {
      var ss = parseSentences(val('bk-text'));
      if (ss.length) await runGen(ss, 'gen-btn', function (g) { applyForm(ss, g); });
    }
  }

  app.addEventListener('click', onClick);
  app.addEventListener('input', function (e) {
    if (e.target.id === 'xl-text') { xl.text = e.target.value; var b = document.querySelector('[data-a=xl-text-run]'); if (b) b.disabled = !xl.text.trim() || xl.busy; }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'shuf') { state.shuffle = e.target.checked; save(); }
    if (e.target.id === 'cheer') { state.cheer = e.target.checked; save(); }
    if (e.target.id === 'xl-ko') { xl.showKo = e.target.checked; render('keep'); }
    if ((e.target.id === 'xl-file' || e.target.id === 'xl-cam') && e.target.files) { xl.files = xl.files.concat(Array.prototype.slice.call(e.target.files)).slice(0, 5); xl.msg = ''; e.target.value = ''; render('keep'); }
    if (e.target.id === 'follow') { state.follow = e.target.checked; save(); }
    if ((e.target.id === 'ph-file' || e.target.id === 'ph-cam') && photo && e.target.files && e.target.files.length) {
      var picked = Array.prototype.slice.call(e.target.files); e.target.value = ''; readPhotos(picked);
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'ans') act.input = t.value;
    else if (t.id === 'pet-name') hatch.name = t.value;
    else if (t.id === 'pet-rename') { var pp = curPet(); if (pp) { pp.name = t.value.trim() || pp.name; save(); } }
    else if (t.id === 'bk-text' || t.id === 'bk-title' || t.id === 'bk-trans' || t.id === 'bk-words') {
      view.draft = readDraft();
      var c = document.getElementById('bk-count'); if (c) c.textContent = '인식된 문장: ' + parseSentences(view.draft.text).length + '개';
    } else if (t.getAttribute('data-a') === 'rename') {
      var k = state.kids.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      if (k) { k.name = t.value.trim() || k.name; save(); }
    }
  });
  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'ans' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (act && !(act.fb && act.fb.ok)) { (act.mode === 'spell' ? checkSpell : checkWrite)(); render('focus'); } }
  });
  if (canSpeak) { try { window.speechSynthesis.onvoiceschanged = function () {}; window.speechSynthesis.getVoices(); } catch (e) {} }

  function render(focus) {
    var h = view.name === 'home' ? homeView() : view.name === 'book' ? bookView() : view.name === 'form' ? formView() :
      view.name === 'settings' ? settingsView() : view.name === 'pet' ? petView() : view.name === 'report' ? reportView() : view.name === 'library' ? libraryView() : view.name === 'xlate' ? xlateView() : actView();
    if (notice) { var nb = noticeBanner(notice); notice = null; if (view.name === 'act' && nb) h = nb + h; }
    app.innerHTML = h;
    if (view.name === 'form' || view.name === 'xlate') syncPhoto();
    if (focus === 'focus') { var el = document.getElementById('ans'); if (el && !(act.fb && act.fb.ok)) el.focus(); }
    if (!focus && view.name !== 'act') { try { window.scrollTo(0, 0); } catch (e) {} }
  }
  render();
  initPhoto();
})();
</script>
